name: Playwright (kumparan web)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # Guest suite only: logged-in tests need a human-solved Turnstile session and skip themselves in CI.
      # Note: kumparan's WAF may block datacenter IPs; failures with HTTP 403 are environmental.
      - run: npx playwright test --project=desktop-chrome --project=mobile-chrome
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
